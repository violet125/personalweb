<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>温馨书桌一角 · Three.js 场景</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f3e6d2; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .topbar {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 9px 18px; border-radius: 999px;
    background: rgba(255, 248, 236, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 6px 24px rgba(120, 88, 52, 0.14);
    backdrop-filter: blur(10px);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #5c5248; font-size: 13px; letter-spacing: 0.06em;
    pointer-events: none; user-select: none;
  }
  .topbar .dot { width: 7px; height: 7px; border-radius: 50%; background: #e8a95c; box-shadow: 0 0 8px #ffbd70; }
  .topbar em { font-style: normal; color: #9b8d7c; font-size: 12px; }

  .panel {
    position: fixed; left: 24px; bottom: 22px;
    display: flex; flex-direction: column; gap: 8px;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .panel button {
    appearance: none; border: 1px solid rgba(255,255,255,.78);
    background: rgba(255, 248, 236, 0.76);
    color: #61564a; font-size: 12.5px; letter-spacing: .04em;
    padding: 9px 15px; border-radius: 11px; cursor: pointer;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px rgba(120, 88, 52, 0.13);
    transition: background .18s ease, transform .18s ease;
    text-align: left;
  }
  .panel button:hover { background: rgba(255,252,244,.95); transform: translateY(-1px); }
  .panel button:active { transform: translateY(0); }

  .hint {
    position: fixed; right: 24px; bottom: 26px;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 11.5px; color: #8d806f; letter-spacing: .05em;
    background: rgba(255, 249, 240, 0.55);
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.5);
    pointer-events: none; user-select: none;
  }

  #chip {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 14px);
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 999px;
    background: rgba(58, 47, 36, 0.80);
    color: #fcecd5; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px; letter-spacing: .05em;
    opacity: 0; transition: opacity .22s ease, transform .22s ease;
    pointer-events: none; backdrop-filter: blur(8px);
  }
  #chip .bar { width: 3px; height: 13px; border-radius: 2px; background: #ffbe74; }
  #chip.show { opacity: 1; transform: translate(-50%, 0); }

  #book-card {
    position: fixed; right: 26px; top: 50%;
    width: 320px; max-width: calc(100vw - 48px);
    padding: 22px 24px 20px 26px;
    border-radius: 18px;
    background: rgba(255, 248, 236, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.82);
    box-shadow: 0 18px 50px rgba(120, 88, 52, 0.22);
    backdrop-filter: blur(14px);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #5c5248;
    opacity: 0; pointer-events: none;
    transform: translateY(-48%) translateX(26px);
    transition: opacity .32s ease, transform .32s cubic-bezier(.2,.7,.3,1);
    z-index: 40;
  }
  #book-card::before {
    content: ''; position: absolute; left: 0; top: 22px; bottom: 22px; width: 4px;
    border-radius: 0 4px 4px 0; background: var(--accent, #c9be9a);
  }
  #book-card.show { opacity: 1; pointer-events: auto; transform: translateY(-50%) translateX(0); }
  #book-card .kicker {
    font-size: 10.5px; letter-spacing: .2em; color: #a89882; margin-bottom: 9px;
  }
  #book-card h2 {
    font-family: Georgia, "Songti SC", "SimSun", serif;
    font-size: 21px; font-weight: 600; letter-spacing: .04em; margin-bottom: 5px;
  }
  #book-card .tag {
    font-size: 11.5px; color: #a89882; letter-spacing: .08em; margin-bottom: 13px;
  }
  #book-card p {
    font-size: 12.5px; line-height: 1.85; color: #7c6f5f; margin-bottom: 17px;
  }
  #book-card a {
    display: inline-block; font-size: 12.5px; color: #9a6a3c; text-decoration: none;
    border-bottom: 1px solid rgba(154, 106, 60, .35); padding-bottom: 2px;
    letter-spacing: .04em;
  }
  #book-card a:hover { color: #7d4f27; border-bottom-color: rgba(125, 79, 39, .6); }

  @media (max-width: 640px) {
    #book-card {
      right: 16px; left: 16px; top: auto; bottom: 18px;
      width: auto; max-width: none;
      transform: translateY(18px);
    }
    #book-card.show { transform: translateY(0); }
  }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #f3e6d2; z-index: 50; transition: opacity .5s ease;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #9c8b76; font-size: 13px; letter-spacing: .18em;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="topbar">
    <span class="dot"></span>
    温馨书桌一角
    <em>Procedural Three.js</em>
  </div>

  <div class="panel">
    <button id="btn-reset">视角复位</button>
    <button id="btn-light">光线：暖阳</button>
  </div>

  <div class="hint">拖拽旋转 · 滚轮缩放 · 点击便利贴摘下 · 点击书本查看</div>
  <div id="chip"><span class="bar"></span><span id="chip-name"></span></div>
  <div id="book-card">
    <div class="kicker">书架藏书 · PROJECT</div>
    <h2 id="book-card-title"></h2>
    <div class="tag" id="book-card-tag"></div>
    <p id="book-card-desc"></p>
    <a id="book-card-link" target="_blank" rel="noopener">打开项目 →</a>
  </div>
  <div id="loading">正在搭建场景…</div>

  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script src="libs/gsap.min.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/core.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/room.js"></script>
  <script src="js/desk.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
